name: 拉取上游规则和模块

on:
  workflow_dispatch:
  schedule:
    # 注意：cron 使用 UTC。25 */12 * * * = 香港时间 08:25 / 20:25
    - cron: '25 */12 * * *'

# 显式声明最小权限：push 需要 contents:write，清理历史运行需要 actions:write
permissions:
  contents: write
  actions: write

# 防止定时任务与手动触发并发导致 push 冲突
concurrency:
  group: auto-update-rules
  cancel-in-progress: false

# 统一 shell，避免逐 step 重复声明
defaults:
  run:
    shell: bash

env:
  TZ: Asia/Hong_Kong
  UPSTREAM_REPO: thNylHx/Tools
  UPSTREAM_BRANCH: main
  DOWNLOAD_PARALLEL: '8'

jobs:
  git-surge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: 检出上游仓库
        uses: actions/checkout@v7
        with:
          repository: thNylHx/Tools
          ref: main
          path: Tools-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # 必须在下载/合并/清洗之前快照：这三步都会覆盖或删除上一次的头部
      - name: 快照既有规则的时间戳与内容指纹
        working-directory: ${{ github.workspace }}/Tools-repo
        run: |
          set -euo pipefail
          export LC_ALL=C

          snapshot="${RUNNER_TEMP}/ruleset-snapshot.tsv"
          : > "$snapshot"

          count=0
          while IFS= read -r -d '' f; do
            # 读取上次写入的时间戳（首次运行时为空）
            ts="$(sed -n '/^# 更新时间:/{s/^# 更新时间:[[:space:]]*//;p;q;}' "$f")"
            # 计算正文字节指纹：剔除全部 # 注释行与空行，只对规则主体取 hash
            hash="$(awk '!/^[[:space:]]*#/ && !/^[[:space:]]*$/' "$f" | sha256sum | cut -d' ' -f1)"
            printf '%s\t%s\t%s\n' "$f" "$ts" "$hash" >> "$snapshot"
            count=$((count + 1))
          done < <(find Ruleset -type f -name '*.list' -print0 | sort -z)

          echo "已快照 ${count} 个规则文件的基线"
          echo "SNAPSHOT=${snapshot}" >> "$GITHUB_ENV"

      - name: 下载上游规则（mihomo + Surge，并行）
        working-directory: ${{ github.workspace }}/Tools-repo
        run: |
          set -euo pipefail

          # 目录必须在这里一次性建全，避免后续 cp 因目录缺失失败
          mkdir -p \
            Ruleset/mihomo/geoip \
            Ruleset/mihomo/geosite \
            Ruleset/mihomo/Block \
            Ruleset/Surge/Block \
            Ruleset/Surge/Media \
            Ruleset/Surge/Other \
            Ruleset/Surge/Temporary \
            Surge/Module \
            Surge/QingRex

          # 目标路径（相对仓库根） => 上游 URL
          declare -A files=(
            # ===== mihomo geosite (.mrs) =====
            ["Ruleset/mihomo/geosite/Ads_all.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
            ["Ruleset/mihomo/geosite/Local.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
            ["Ruleset/mihomo/geosite/China.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
            ["Ruleset/mihomo/geosite/Openai.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/openai.mrs"
            ["Ruleset/mihomo/geosite/PayPal.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.mrs"
            ["Ruleset/mihomo/geosite/Apple.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"
            ["Ruleset/mihomo/geosite/Apple@cn.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple@cn.mrs"
            ["Ruleset/mihomo/geosite/Global.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"
            ["Ruleset/mihomo/geosite/GlobalGFW.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs"
            ["Ruleset/mihomo/geosite/Google.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"
            ["Ruleset/mihomo/geosite/YouTube.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"
            ["Ruleset/mihomo/geosite/Steam.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs"
            ["Ruleset/mihomo/geosite/Steam@cn.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam@cn.mrs"
            ["Ruleset/mihomo/geosite/Epic.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/epicgames.mrs"
            ["Ruleset/mihomo/geosite/Facebook.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/facebook.mrs"
            ["Ruleset/mihomo/geosite/Instagram.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/instagram.mrs"
            ["Ruleset/mihomo/geosite/Twitter.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/twitter.mrs"
            ["Ruleset/mihomo/geosite/Telegram.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"
            ["Ruleset/mihomo/geosite/Line.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/line.mrs"
            ["Ruleset/mihomo/geosite/GitHub.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs"
            ["Ruleset/mihomo/geosite/OneDrive.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/onedrive.mrs"
            ["Ruleset/mihomo/geosite/Microsoft.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"
            ["Ruleset/mihomo/geosite/Microsoft@cn.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft@cn.mrs"
            ["Ruleset/mihomo/geosite/Tiktok.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs"
            ["Ruleset/mihomo/geosite/Bilibili.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bilibili.mrs"
            ["Ruleset/mihomo/geosite/Disney.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/disney.mrs"
            ["Ruleset/mihomo/geosite/Netflix.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs"
            ["Ruleset/mihomo/geosite/Spotify.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/spotify.mrs"
            ["Ruleset/mihomo/geosite/Talkatone.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/talkatone.mrs"
            # ===== mihomo geoip (.mrs) =====
            ["Ruleset/mihomo/geoip/Local.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
            ["Ruleset/mihomo/geoip/China.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
            ["Ruleset/mihomo/geoip/Netflix.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.mrs"
            ["Ruleset/mihomo/geoip/Twitter.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/twitter.mrs"
            ["Ruleset/mihomo/geoip/Telegram.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs"
            ["Ruleset/mihomo/geoip/Facebook.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/facebook.mrs"
            ["Ruleset/mihomo/geoip/Google.mrs"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"

            # ===== Surge / Temporary（原始分片，合并后不对外发布） =====
            ["Ruleset/Surge/Temporary/Ads_BanAD.list"]="https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list"
            ["Ruleset/Surge/Temporary/Ads_BanProgramAD.list"]="https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list"
            ["Ruleset/Surge/Temporary/Ads_Dlerio.list"]="https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/AdBlock.list"
            ["Ruleset/Surge/Temporary/Ads_Chinese.list"]="https://raw.githubusercontent.com/geekdada/surge-list/master/domain-set/chinese-filter.txt"
            ["Ruleset/Surge/Temporary/Ads_Easylistsurge.list"]="https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/rule/Surge/easylist_surge.list"
            ["Ruleset/Surge/Temporary/Ads_Tracking.list"]="https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Reject/Tracking.list"
            ["Ruleset/Surge/Temporary/Ads_AdBlockLoonLite.list"]="https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockloonlite.list"
            ["Ruleset/Surge/Temporary/Ads_Malicious.list"]="https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Reject/Malicious.list"
            ["Ruleset/Surge/Temporary/Ads_EasyListChina.list"]="https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/rule/Surge/easylistchina_surge.list"
            ["Ruleset/Surge/Temporary/Ads_MyBlockAds.list"]="https://raw.githubusercontent.com/Abcd789JK/Tools/refs/heads/main/Ruleset/Surge/Block/BlockAds.list"
            ["Ruleset/Surge/Temporary/Ads_EasyPrivacysurge.list"]="https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/rule/Surge/easyprivacy_surge.list"
            ["Ruleset/Surge/Temporary/Ads_Advertising.list"]="https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Reject/Advertising.list"
            ["Ruleset/Surge/Temporary/Ads_Adblock4limbosurge.list"]="https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/Surge/rule/Adblock4limbo_surge.list"
            ["Ruleset/Surge/Temporary/Ads_AWAvenue.list"]="https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list"
            ["Ruleset/Surge/Temporary/Ads_All.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/classical/category-ads-all.list"
            ["Ruleset/Surge/Temporary/YouTubeMusic.list"]="https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTubeMusic.list"
            ["Ruleset/Surge/Temporary/YouTube.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/youtube.list"
            ["Ruleset/Surge/Temporary/Twitter_ip.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/twitter.list"
            ["Ruleset/Surge/Temporary/Twitter.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/twitter.list"
            ["Ruleset/Surge/Temporary/Facebook_ip.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/facebook.list"
            ["Ruleset/Surge/Temporary/Facebook.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/facebook.list"
            ["Ruleset/Surge/Temporary/Instagram.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/instagram.list"
            ["Ruleset/Surge/Temporary/Netflix_ip.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.list"
            ["Ruleset/Surge/Temporary/Netflix.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/netflix.list"
            ["Ruleset/Surge/Temporary/Telegram_ip.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/telegram.list"
            ["Ruleset/Surge/Temporary/Telegram_0.list"]="https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Telegram.list"
            ["Ruleset/Surge/Temporary/Telegram_1.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/classical/telegram.list"
            ["Ruleset/Surge/Temporary/GlobalGFW_0.list"]="https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list"
            ["Ruleset/Surge/Temporary/GlobalGFW_1.list"]="https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/gfw.txt"
            ["Ruleset/Surge/Temporary/GlobalGFW_2.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/gfw.list"
            ["Ruleset/Surge/Temporary/GlobalGFW_3.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/geolocation-!cn.list"
            ["Ruleset/Surge/Temporary/Google_ip.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.list"
            ["Ruleset/Surge/Temporary/Google.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/google.list"
            ["Ruleset/Surge/Temporary/Gemini.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/google-gemini.list"
            ["Ruleset/Surge/Temporary/Apple_0.list"]="https://github.com/ACL4SSR/ACL4SSR/raw/master/Clash/Apple.list"
            ["Ruleset/Surge/Temporary/Apple_1.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/apple.list"
            ["Ruleset/Surge/Temporary/Talkatone_0.list"]="https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Talkatone.list"
            ["Ruleset/Surge/Temporary/Talkatone_1.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/classical/talkatone.list"
            ["Ruleset/Surge/Temporary/Openai_0.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/classical/openai.list"
            ["Ruleset/Surge/Temporary/Openai_1.list"]="https://raw.githubusercontent.com/EAlyce/conf/refs/heads/main/Rule/OpenAI.list"

            # ===== Surge / Media =====
            ["Ruleset/Surge/Media/GlobalMedia.list"]="https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list"
            ["Ruleset/Surge/Media/BilibiliHMT.list"]="https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/BilibiliHMT.list"
            ["Ruleset/Surge/Media/Disney.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/disney.list"
            ["Ruleset/Surge/Media/Spotify.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/spotify.list"
            ["Ruleset/Surge/Media/TikTok.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/classical/tiktok.list"
            ["Ruleset/Surge/Media/ChinaMedia.list"]="https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list"
            ["Ruleset/Surge/Media/Bilibili.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/bilibili.list"

            # ===== Surge / Other =====
            ["Ruleset/Surge/Other/Line.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/line.list"
            ["Ruleset/Surge/Other/GitHub.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/github.list"
            ["Ruleset/Surge/Other/OneDrive.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/onedrive.list"
            ["Ruleset/Surge/Other/Microsoft.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/microsoft.list"
            ["Ruleset/Surge/Other/Steam.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/steam.list"
            ["Ruleset/Surge/Other/Epic.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/epicgames.list"
            ["Ruleset/Surge/Other/PayPal.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/paypal.list"
            ["Ruleset/Surge/Other/Gemini.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/google-gemini.list"
            ["Ruleset/Surge/Other/ChinaASN.list"]="https://raw.githubusercontent.com/missuo/ASN-China/main/ASN.China.list"
            ["Ruleset/Surge/Other/China_ip.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.list"
            ["Ruleset/Surge/Other/China.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/cn.list"
            ["Ruleset/Surge/Other/Private_ip.list"]="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.list"
          )

          # 生成 "目标路径 <TAB> URL" 清单，交给 xargs 并发下载
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          fail_log="$workdir/failures.log"
          : > "$fail_log"
          export fail_log

          manifest="$workdir/manifest.tsv"
          : > "$manifest"
          for dest in "${!files[@]}"; do
            printf '%s\t%s\n' "$dest" "${files[$dest]}" >> "$manifest"
          done

          # 单文件下载：失败不落盘（.part 临时文件），成功才 mv
          fetch_one() {
            local entry="$1"
            local dest="${entry%%$'\t'*}"
            local url="${entry#*$'\t'}"
            local part="${dest}.part"

            mkdir -p "$(dirname "$dest")"
            if curl -fsSL --compressed \
                 --connect-timeout 15 --max-time 90 \
                 --retry 3 --retry-delay 3 --retry-all-errors \
                 --remove-on-error \
                 -o "$part" "$url" && [[ -s "$part" ]]; then
              mv -f "$part" "$dest"
            else
              rm -f "$part"
              printf '%s\n' "$url" >> "$fail_log"
              return 1
            fi
          }
          export -f fetch_one

          echo "开始并发下载（并行度 ${DOWNLOAD_PARALLEL}）..."
          # xargs 在有失败项时返回 123，这里用 || true 吞掉，改为按日志统计
          xargs -r -d '\n' -P "${DOWNLOAD_PARALLEL}" -n 1 \
            bash -c 'fetch_one "$1"' _ < "$manifest" || true

          failures=$(wc -l < "$fail_log" | tr -d ' ')
          if [[ "$failures" -gt 0 ]]; then
            echo "::warning::共有 ${failures} 个上游文件下载失败，继续执行"
            cat "$fail_log"
          else
            echo "全部上游规则下载成功"
          fi
          echo "failures=${failures}" >> "$GITHUB_ENV"

      - name: 合并 Surge 规则分片
        working-directory: ${{ github.workspace }}/Tools-repo
        run: |
          set -euo pipefail

          merge_local() {
            local output="$1"
            shift
            echo "合并 -> $output"
            mkdir -p "$(dirname "$output")"
            : > "$output"
            for file in "$@"; do
              if [[ -s "$file" ]]; then
                echo "  合并: $file"
                cat "$file" >> "$output"
                echo "" >> "$output"
              else
                echo "  缺失: $file"
              fi
            done
          }

          merge_local "Ruleset/Surge/Block/Ads_Block.list" \
            Ruleset/Surge/Temporary/Ads_All.list \
            Ruleset/Surge/Temporary/Ads_BanAD.list \
            Ruleset/Surge/Temporary/Ads_Tracking.list \
            Ruleset/Surge/Temporary/Ads_AWAvenue.list \
            Ruleset/Surge/Temporary/Ads_Malicious.list \
            Ruleset/Surge/Temporary/Ads_MyBlockAds.list \
            Ruleset/Surge/Temporary/Ads_Advertising.list \
            Ruleset/Surge/Temporary/Ads_BanProgramAD.list \
            Ruleset/Surge/Temporary/Ads_AdBlockLoonLite.list

          merge_local "Ruleset/Surge/Other/Apple.list" \
            Ruleset/Surge/Temporary/Apple_0.list \
            Ruleset/Surge/Temporary/Apple_1.list

          merge_local "Ruleset/Surge/Other/Openai.list" \
            Ruleset/Surge/Temporary/Openai_0.list \
            Ruleset/Surge/Temporary/Openai_1.list

          merge_local "Ruleset/Surge/Media/Netflix.list" \
            Ruleset/Surge/Temporary/Netflix.list \
            Ruleset/Surge/Temporary/Netflix_ip.list

          merge_local "Ruleset/Surge/Media/Twitter.list" \
            Ruleset/Surge/Temporary/Twitter.list \
            Ruleset/Surge/Temporary/Twitter_ip.list

          merge_local "Ruleset/Surge/Media/YouTube.list" \
            Ruleset/Surge/Temporary/YouTubeMusic.list \
            Ruleset/Surge/Temporary/YouTube.list

          merge_local "Ruleset/Surge/Media/Facebook.list" \
            Ruleset/Surge/Temporary/Facebook.list \
            Ruleset/Surge/Temporary/Instagram.list \
            Ruleset/Surge/Temporary/Facebook_ip.list

          merge_local "Ruleset/Surge/Media/Telegram.list" \
            Ruleset/Surge/Temporary/Telegram_0.list \
            Ruleset/Surge/Temporary/Telegram_1.list \
            Ruleset/Surge/Temporary/Telegram_ip.list

          merge_local "Ruleset/Surge/Other/Talkatone.list" \
            Ruleset/Surge/Temporary/Talkatone_0.list \
            Ruleset/Surge/Temporary/Talkatone_1.list

          merge_local "Ruleset/Surge/Other/Google.list" \
            Ruleset/Surge/Temporary/Google.list \
            Ruleset/Surge/Temporary/Gemini.list \
            Ruleset/Surge/Temporary/Google_ip.list

          merge_local "Ruleset/Surge/Other/Global.list" \
            Ruleset/Surge/Temporary/GlobalGFW_0.list \
            Ruleset/Surge/Temporary/GlobalGFW_1.list \
            Ruleset/Surge/Temporary/GlobalGFW_2.list \
            Ruleset/Surge/Temporary/GlobalGFW_3.list

      - name: 转换 mihomo 不支持的规则类型
        working-directory: ${{ github.workspace }}/Tools-repo
        run: |
          set -euo pipefail

          # 从清洗前的 Surge 广告规则派生 mihomo 版本
          cp -f "Ruleset/Surge/Block/Ads_Block.list" "Ruleset/mihomo/Block/Ads_Block.list"

          for file in Ruleset/mihomo/Block/*.list; do
            [[ -f "$file" ]] || continue

            # mihomo 不支持的类型：URL-REGEX / USER-AGENT / AND
            sed -i -E '/^(URL-REGEX|USER-AGENT|AND),/d' "$file"

            # DOMAIN-WILDCARD *.example.com -> DOMAIN-SUFFIX example.com
            sed -i -E 's/^DOMAIN-WILDCARD,\*\.(.+)/DOMAIN-SUFFIX,\1/' "$file"

            # 其余无法转换的 DOMAIN-WILDCARD 直接丢弃
            sed -i '/^DOMAIN-WILDCARD,/d' "$file"
          done

      - name: 规范化、排序、去重
        working-directory: ${{ github.workspace }}/Tools-repo
        run: |
          set -euo pipefail
          shopt -s globstar
          # 固定 locale，保证排序结果跨 runner 一致，避免无意义 diff
          export LC_ALL=C

          # 本次运行统一时间戳：同一轮所有文件共用，避免相互相差几秒
          run_ts="$(date +'%Y-%m-%d %H:%M:%S')"
          # 上一步生成的基线快照（路径 -> 旧时间戳 / 旧正文指纹）
          snapshot="${SNAPSHOT:?未找到快照文件，请检查上一步是否执行}"
          echo "本次运行时间戳: ${run_ts}"

          for file in Ruleset/Surge/**/*.list Ruleset/mihomo/Block/*.list; do
            [[ -f "$file" ]] || continue

            # 排除 FakeIP 规则
            case "$file" in
              Ruleset/Surge/Other/Fakeip.list|Ruleset/Surge/Other/Fakeip@cn.list)
                continue
                ;;
            esac

            # 1. 删除注释、空行、行内注释、reject 后缀、无效规则，并去除首尾空白
            sed -i -E '
              /^DOMAIN-REGEX,/d
              /^[[:space:]]*[#;]/d
              /^[[:space:]]*\/\//d
              /^[[:space:]]*$/d
              s|[[:space:]]+//.*||
              s/,reject(,[^,]+)*$//I
              s/,[[:space:]]*/,/g
              s/^[[:space:]]+//
              s/[[:space:]]+$//
            ' "$file"

            # 2. 丢弃段头行（[Rule] / [Script] 等），避免被下方兜底规则污染
            sed -i -E '/^[[:space:]]*\[/d' "$file"

            # 3. 删除指定域名
            sed -i -e '/DOMAIN,ad\.12306\.cn/d' "$file"

            # 4. 删除 IP 规则尾部多余的 ,no-resolve（下方会统一补回）
            sed -i -E '/^[[:space:]]*(IP-CIDR6?|IP-ASN),/s/,no-resolve//g' "$file"

            # 5. 裸 IP / 裸域名补前缀
            sed -i -E '/^IP-CIDR,/!{/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+/s/^/IP-CIDR,/}' "$file"
            sed -i -E '/^IP-CIDR6,/!{/^([a-fA-F0-9]*:){2,}[a-fA-F0-9]*\/[0-9]+/s/^/IP-CIDR6,/}' "$file"
            # AdGuard 风格通配前缀 +. / *. 统一转 DOMAIN-SUFFIX
            sed -i -E '/^[+*]\./s/^[+*]\./DOMAIN-SUFFIX,/' "$file"
            sed -i '/^\./s/^\./DOMAIN-SUFFIX,/' "$file"

            # 6. 兜底：仅对"看起来像域名"的行补 DOMAIN, 前缀
            sed -i -E '/^[A-Za-z0-9_*.-]+(:[0-9]+)?$/s/^/DOMAIN,/' "$file"

            # 7. 丢弃既无逗号、又不像域名/IP 的残留行（YAML 头、payload: 等）
            sed -i -E '/,/!{/^[A-Za-z0-9_*.-]+(:[0-9]+)?$/!{/^([0-9]{1,3}\.){3}[0-9]{1,3}(\/[0-9]{1,2})?$/!d}}' "$file"

            # 8. 为 IP 规则统一补 ,no-resolve
            sed -i -E '/^[[:space:]]*(IP-CIDR6?|IP-ASN),/s/^((IP-CIDR6?|IP-ASN),[^,()]+)/\1,no-resolve/' "$file"

            # 9. 按规则类型分桶排序（-s 保证相同键的相对顺序稳定）
            awk '
              /^DOMAIN,/          { print "0 " $0; next }
              /^DOMAIN-SUFFIX,/   { print "1 " $0; next }
              /^DOMAIN-KEYWORD,/  { print "2 " $0; next }
              /^DOMAIN-WILDCARD,/ { print "3 " $0; next }
              /^IP-CIDR,/         { print "4 " $0; next }
              /^IP-CIDR6,/        { print "5 " $0; next }
              /^IP-ASN,/          { print "6 " $0; next }
              /^PROCESS-NAME,/    { print "7 " $0; next }
              /^URL-REGEX,/       { print "8 " $0; next }
              /^USER-AGENT,/      { print "9 " $0; next }
              /^GEOIP,/           { print "10 " $0; next }
              /^AND,/             { print "11 " $0; next }
              /^OR,/              { print "12 " $0; next }
              /^NOT,/             { print "13 " $0; next }
              /^DEST-PORT,/       { print "14 " $0; next }
                                  { print "15 " $0; next }
            ' "$file" | sort -s -k1,1n -k2 | cut -d' ' -f2- > "$file.sorted"
            mv -f "$file.sorted" "$file"

            # 10. 去重（大小写不敏感）
            awk '!seen[tolower($0)]++' "$file" > "$file.dedup"
            mv -f "$file.dedup" "$file"

            # 11. 写入头部（行数统计必须在加头之前完成）
            file_name="$(basename "$file" .list)"
            line_count="$(wc -l < "$file" | tr -d ' ')"

            # 与上次发布的内容比对：正文一致则沿用旧时间戳，否则刷新为本次运行时间
            new_hash="$(sha256sum "$file" | cut -d' ' -f1)"
            old_ts="$(awk -F'\t' -v p="$file" '$1==p{print $2; exit}' "$snapshot")"
            old_hash="$(awk -F'\t' -v p="$file" '$1==p{print $3; exit}' "$snapshot")"

            if [[ -n "$old_ts" && "$old_hash" == "$new_hash" ]]; then
              updated="$old_ts"
            else
              updated="$run_ts"
            fi

            {
              echo "# 规则名称: ${file_name}"
              echo "# 仓库作者: thNylHx"
              echo "# 仓库地址: https://github.com/thNylHx/Tools"
              echo "# 规则数量: ${line_count}"
              echo "# 更新时间: ${updated}"
              echo ""
              cat "$file"
            } > "$file.tmp"
            mv -f "$file.tmp" "$file"

            echo "完成: $file (${line_count} 条, 更新于 ${updated})"
          done

      - name: 生成 Surge 广告模块
        working-directory: ${{ github.workspace }}/Tools-repo
        run: |
          set -euo pipefail

          src="Ruleset/Surge/Block/Ads_Block.list"
          out="Surge/Module/Ads_Block.sgmodule"
          [[ -s "$src" ]] || { echo "::error::缺少已清洗的 $src"; exit 1; }

          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          # 输入已是清洗后的纯规则列表，此处只负责补 REJECT 动作，不再重复排序
          sed -E 's/,no-resolve//g' "$src" | awk -F, '
            /^[[:space:]]*#/  { next }
            /^[[:space:]]*$/  { next }
            $1 ~ /^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|URL-REGEX|USER-AGENT|AND)$/ {
              print $0 ",REJECT,extended-matching,pre-matching"; next
            }
            $1 ~ /^(IP-CIDR6?|IP-ASN)$/ {
              print $0 ",REJECT,no-resolve,extended-matching,pre-matching"; next
            }
            { print $0 }
          ' > "$body"

          rule_count="$(wc -l < "$body" | tr -d ' ')"
          {
            echo "#!name = Block Ads | 广告拦截规则合集模块"
            echo "#!desc = 名称: 广告拦截规则合集模块"
            echo "#!author = RuCu6 Keywos fmz200 可莉🅥 QingRex"
            echo "#!category = Block Ads"
            echo "#!tag = 广告拦截规则合集模块"
            echo "#!Rule = ${rule_count}"
            echo ""
            echo ""
            echo "[Rule]"
            cat "$body"
          } > "$out.tmp"
          mv -f "$out.tmp" "$out"

          echo "已生成 $out（${rule_count} 条规则）"

      - name: 同步 LoonKissSurge 模块
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          repo_dir="${{ github.workspace }}/LoonKissSurge"
          target_dir="${{ github.workspace }}/Tools-repo/Surge/QingRex"

          rm -rf "$repo_dir"
          git clone --depth=1 --single-branch \
            "https://github.com/QingRex/LoonKissSurge.git" "$repo_dir"

          [[ -d "$repo_dir/Surge" ]] || { echo "::error::上游缺少 Surge 目录"; exit 1; }

          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          cp -r "$repo_dir/Surge/." "$target_dir/"
          echo "已同步 LoonKissSurge -> Surge/QingRex"

      - name: 提交并推送更新
        working-directory: ${{ github.workspace }}/Tools-repo
        run: |
          set -euo pipefail

          git config --local user.name "GitHub Actions"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "规则文件无变更，跳过提交"
            {
              echo "changed=false"
              echo "added=0"
              echo "modified=0"
              echo "deleted=0"
              echo "files="
            } >> "$GITHUB_ENV"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_ENV"

          # 用 awk 统计，避免 grep 无匹配时返回 1 触发 pipefail
          added="$(git diff --cached --name-status | awk '$1=="A"' | wc -l | tr -d ' ')"
          modified="$(git diff --cached --name-status | awk '$1=="M"' | wc -l | tr -d ' ')"
          deleted="$(git diff --cached --name-status | awk '$1=="D"' | wc -l | tr -d ' ')"
          echo "added=${added}"       >> "$GITHUB_ENV"
          echo "modified=${modified}" >> "$GITHUB_ENV"
          echo "deleted=${deleted}"   >> "$GITHUB_ENV"

          # 用 awk 取前 20 行，避免 head 提前关闭管道触发 SIGPIPE
          {
            echo "files<<__EOF__"
            git diff --cached --name-only | awk 'NR<=20{print "- "$0}'
            echo "__EOF__"
          } >> "$GITHUB_ENV"

          git commit -m "Auto Update Ruleset $(date +'%Y-%m-%d %H:%M:%S')"

          # 先提交再 rebase：工作区已干净，无需 --autostash，冲突概率大幅降低
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin "${UPSTREAM_BRANCH}" \
               && git push origin "HEAD:${UPSTREAM_BRANCH}"; then
              pushed=1
              break
            fi
            echo "第 ${attempt} 次推送失败，$((attempt * 5))s 后重试"
            sleep $((attempt * 5))
          done

          if [[ "$pushed" -ne 1 ]]; then
            echo "::error::推送失败，请检查仓库权限或分支保护规则"
            exit 1
          fi
          echo "规则同步并推送成功"

      - name: 设置时间与变更信息
        run: |
          set -euo pipefail

          echo "time=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

          if [[ "${changed:-false}" == "true" ]]; then
            {
              echo "diff_text<<__EOF__"
              echo "📈 <b>变更详细</b>"
              echo "➕ 新增: ${added:-0}"
              echo "✏️ 修改: ${modified:-0}"
              echo "❌ 删除: ${deleted:-0}"
              echo ""
              echo "📂 <b>变更文件</b>"
              echo "<pre>${files:-}</pre>"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          else
            echo "diff_text=" >> "$GITHUB_ENV"
          fi

      - name: 发送 Telegram 通知
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            📢 <b>GitHub Actions 自动化任务通知</b>

            ✉️ 标题: Surge 上游规则模块拉取
            📦 仓库: 梨花香
            ⏰ 时间: ${{ env.time || 'N/A' }}

            🎯 状态: ${{ job.status == 'success' && '恭喜你! 任务成功' || '很遗憾! 任务失败' }}
            📊 更新: ${{ env.changed == 'true' && '本次有更新' || (env.changed == 'false' && '本次无更新' || '未执行到提交阶段') }}
            ⚠️ 下载失败: ${{ env.failures || '0' }} 个

            ${{ env.diff_text }}

      - name: 清理旧工作流运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 3
